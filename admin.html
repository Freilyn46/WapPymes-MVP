<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WapPymes | Panel del negocio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="runtime-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
    <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
      <div>
        <p class="text-xs font-bold uppercase tracking-widest text-emerald-700">WapPymes</p>
        <h1 class="mt-1 text-3xl font-black">Panel del negocio</h1>
      </div>
      <a href="index.html" class="text-sm font-semibold text-emerald-700 hover:underline">Ver página pública</a>
    </header>

    <p id="appStatus" class="mb-6 hidden rounded-xl p-3 text-sm" role="status"></p>

    <section id="authView" class="mx-auto max-w-md rounded-2xl bg-white p-6 shadow-sm">
      <h2 id="authTitle" class="text-xl font-bold">Iniciar sesión</h2>
      <p class="mt-1 text-sm text-slate-500">Administra tu negocio, servicios y reservas.</p>
      <form id="authForm" class="mt-6 space-y-4">
        <input id="authEmail" type="email" required placeholder="Correo" class="w-full rounded-xl border border-slate-300 px-4 py-3">
        <input id="authPassword" type="password" required minlength="6" placeholder="Contraseña (mínimo 6 caracteres)" class="w-full rounded-xl border border-slate-300 px-4 py-3">
        <button id="authSubmit" class="w-full rounded-xl bg-emerald-600 px-4 py-3 font-bold text-white hover:bg-emerald-700">Iniciar sesión</button>
      </form>
      <button id="authToggle" class="mt-4 w-full text-sm text-slate-500 hover:text-slate-800">¿No tienes cuenta? Crear una</button>
    </section>

    <section id="panelView" class="hidden space-y-6">
      <div class="flex items-center justify-between rounded-2xl bg-white p-4 shadow-sm">
        <p class="text-sm text-slate-600">Sesión: <strong id="userEmail"></strong></p>
        <button id="signOut" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold">Cerrar sesión</button>
      </div>

      <div class="grid gap-6 lg:grid-cols-2">
        <section class="rounded-2xl bg-white p-6 shadow-sm">
          <h2 class="text-xl font-bold">Datos del negocio</h2>
          <form id="businessForm" class="mt-5 space-y-4">
            <input id="businessName" required placeholder="Nombre del negocio" class="w-full rounded-xl border border-slate-300 px-4 py-3">
            <input id="businessSlug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="slug-del-negocio" class="w-full rounded-xl border border-slate-300 px-4 py-3">
            <input id="businessPhone" required placeholder="WhatsApp: 8095551234" class="w-full rounded-xl border border-slate-300 px-4 py-3">
            <textarea id="businessDescription" rows="3" placeholder="Descripción breve" class="w-full rounded-xl border border-slate-300 px-4 py-3"></textarea>
            <button class="w-full rounded-xl bg-emerald-600 px-4 py-3 font-bold text-white hover:bg-emerald-700">Guardar negocio</button>
          </form>
          <p id="publicLink" class="mt-4 text-sm text-slate-500"></p>
        </section>

        <section class="rounded-2xl bg-white p-6 shadow-sm">
          <h2 class="text-xl font-bold">Agregar servicio</h2>
          <form id="serviceForm" class="mt-5 space-y-4">
            <input id="serviceName" required placeholder="Nombre del servicio" class="w-full rounded-xl border border-slate-300 px-4 py-3">
            <textarea id="serviceDescription" rows="2" placeholder="Descripción (opcional)" class="w-full rounded-xl border border-slate-300 px-4 py-3"></textarea>
            <div class="grid grid-cols-2 gap-3">
              <input id="servicePrice" type="number" min="0" step="0.01" placeholder="Precio" class="rounded-xl border border-slate-300 px-4 py-3">
              <input id="serviceDuration" type="number" min="1" placeholder="Minutos" class="rounded-xl border border-slate-300 px-4 py-3">
            </div>
            <button class="w-full rounded-xl bg-slate-900 px-4 py-3 font-bold text-white hover:bg-slate-700">Agregar servicio</button>
          </form>
          <div id="servicesList" class="mt-6 space-y-3"></div>
        </section>
      </div>

      <section class="rounded-2xl bg-white p-6 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div><h2 class="text-xl font-bold">Reservas recibidas</h2><p class="text-sm text-slate-500">Actualiza el estado de cada solicitud.</p></div>
          <button id="refreshBookings" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold">Actualizar</button>
        </div>
        <div id="bookingsList" class="mt-5 overflow-x-auto"></div>
      </section>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
