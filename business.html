<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WapPymes | Reserva</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-100 text-slate-800">
  <main class="max-w-4xl mx-auto px-4 py-12">
    <section class="bg-white rounded-3xl shadow-lg p-6 md:p-8 mb-8">
      <p class="text-xs font-bold uppercase tracking-wide text-emerald-700">Reservas</p>
      <h1 id="businessName" class="text-3xl md:text-4xl font-black mt-2">Cargando negocio...</h1>
      <p id="businessMeta" class="text-slate-600 mt-2">Preparando formulario de reserva.</p>
    </section>

    <section class="bg-white rounded-3xl shadow-lg p-6 md:p-8">
      <form id="businessReservationForm" class="space-y-5">
        <input type="hidden" id="businessPhone" />

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Servicio o producto</label>
          <select id="serviceName" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="">Sin servicio específico</option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Fecha</label>
            <input type="date" id="orderDate" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-500 outline-none" required />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Hora</label>
            <input type="time" id="orderTime" value="16:00" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-500 outline-none" required />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Tu nombre</label>
          <input type="text" id="clientName" value="Juan Pérez" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-500 outline-none" required />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Tu teléfono (opcional)</label>
          <input type="tel" id="clientPhone" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="809 555 1234" />
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl transition flex items-center justify-center gap-2">
          <i class="fa-brands fa-whatsapp text-xl"></i>
          <span>Enviar reserva por WhatsApp</span>
        </button>
        <p id="reservationStatus" class="text-sm text-slate-600" role="status"></p>
      </form>

      <div class="mt-8 bg-slate-100 p-4 rounded-xl border border-slate-200">
        <p class="text-xs font-bold uppercase text-slate-500 mb-2">Mensaje que se enviará</p>
        <pre id="previewMessage" class="text-xs text-slate-700 whitespace-pre-wrap bg-white p-3 rounded border border-slate-200 font-mono"></pre>
      </div>
    </section>
  </main>

  <script src="app-config.js?v=1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="main.js"></script>
</body>
</html>
